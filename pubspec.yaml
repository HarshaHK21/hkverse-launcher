name: hkverse_launcher
description: "A minimalist, distraction-free Android launcher in the HKVerse brand identity."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 700
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 700
        - asset: assets/fonts/Outfit-Variable.ttf
          weight: 800